- insert:
    - id: finfreedom-skills
      name: '@finfreedom/dsh-plugin/skills'
    - id: finfreedom-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: finfreedom
        transport: stdio
        command: !!js dshHomePath('finfreedom/venv/bin/python')
        args: ['-m', 'finfreedom.mcp_server']
        env:
          FINFREEDOM_DATA_DIR: !!js dshHomePath('finfreedom')
          PYTHONUNBUFFERED: '1'
          FINFREEDOM_ENABLE_WRITES: '1'
        failOnStartupError: true
        reconnect:
          enabled: true
          initialDelayMs: 500
          maxDelayMs: 30000
          maxAttempts: 10
    - id: finfreedom-ui
      name: '@finfreedom/dsh-plugin'
