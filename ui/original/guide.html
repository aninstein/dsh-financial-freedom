<!doctype html>
<html lang="zh-CN" data-workspace-theme="light">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI投研 — finfreedom</title><link rel="icon" href="finfreedom-mark.svg"><link rel="stylesheet" href="guide.css"></head>
<body><main class="guide"><header class="intro"><div class="intro-mark"><img src="finfreedom-mark.svg" alt="" width="40" height="40"><span>FINFREEDOM / AI投研</span></div><p class="eyebrow">你的投研词条</p><h1>今天，想研究什么？</h1><p class="explain">点击词条打开 DSH 对话。收藏常用词条，或用 Markdown 写下自己的研究方法。</p></header><div class="toolbar"><nav class="tabs" aria-label="词条分类"><button type="button" data-view="recommendations" aria-current="page">推荐</button><button type="button" data-view="favorites">收藏</button><button type="button" data-view="mine">我的</button><button type="button" data-view="all">内置词条</button></nav><button type="button" id="create-entry" class="create">＋ 新建词条</button></div><section class="recommendations" aria-labelledby="recommendations-title"><div class="recommendations-head"><div><p class="recommendations-label">时事观察 · 每小时更新</p><h2 id="recommendations-title">新闻推荐</h2><p class="recommendations-note">基于近期财经新闻生成研究方向，点击词条开始对话；编辑后可保存到“我的”。</p></div><button type="button" id="recommendations-refresh" class="subtle">立即更新</button></div><p id="recommendations-status" class="recommendations-status" role="status" aria-live="polite">正在加载推荐…</p><div id="recommendations-content" class="grid"></div></section><div class="filters"><label class="search-label"><span class="sr-only">搜索当前词条</span><input id="entry-search" type="search" placeholder="搜索词条、内容或 Skill" autocomplete="off"></label><label class="category-label"><span class="sr-only">筛选词条分类</span><select id="entry-category"><option value="">全部分类</option></select></label><span id="entry-count" class="entry-count" aria-live="polite"></span></div><p id="guide-feedback" class="status" role="status" aria-live="polite"></p><div id="guide-content"></div><dialog id="entry-dialog"><form id="entry-form"><div class="editor-head"><div><span class="eyebrow">MARKDOWN</span><h2 id="editor-title">编辑词条</h2></div><button type="button" id="editor-close" class="icon-button" aria-label="关闭编辑器">×</button></div><label for="entry-markdown">词条内容</label><p class="editor-help">用一级标题（# 标题）命名；正文会作为对话提示词。</p><textarea id="entry-markdown" required maxlength="20000" spellcheck="false"></textarea><p id="editor-error" class="error" role="alert"></p><div class="editor-actions"><button type="button" id="editor-cancel" class="subtle">取消</button><button type="submit" class="save">保存词条</button></div></form></dialog></main><script type="module" src="guide.js"></script></body></html>
